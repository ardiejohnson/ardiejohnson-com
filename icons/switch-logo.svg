<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 -10 5181 829" width="250" height="40" fill="none" role="img" aria-label="Switch">
  <title>Switch</title>
  <style>
    .ltr { fill:#111111; animation:ltr 5.2s infinite cubic-bezier(.6,0,.2,1); }
    .trk { animation:trk 5.2s infinite steps(1,end); }
    .knb { animation:knb 5.2s infinite cubic-bezier(.5,0,.15,1);
            transform-box:view-box; transform-origin:0 0; }

    @keyframes knb {
      0%, 12%    { transform:translateY(325.02px); }
      16.5%      { transform:translateY(-14.63px); }
      20%, 60%   { transform:translateY(0); }
      64.5%      { transform:translateY(339.64px); }
      68%, 100%  { transform:translateY(325.02px); }
    }
    @keyframes trk {
      0%, 15%    { fill:#3B82F6; }
      16%        { fill:#93C5FD; }
      20%, 60%   { fill:#3B82F6; }
      61%        { fill:#93C5FD; }
      65%, 100%  { fill:#3B82F6; }
    }
    @keyframes ltr {
      0%, 17%    { fill:#111111; }
      23%, 59%   { fill:#FFFFFF; }
      65%, 100%  { fill:#111111; }
    }

    @media (prefers-reduced-motion:reduce){
      .ltr,.trk,.knb{ animation:none; }
      .knb{ transform:translateY(325.02px); }
      .trk{ fill:#3B82F6; }
    }
  </style>
